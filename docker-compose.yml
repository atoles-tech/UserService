services:
  postgres:
    image: postgres:17
    container_name: user-service-db
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  user-service:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: