spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/user_service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    
  data:
    redis:
      host: redis
      port: 6379
      timeout: 5000ms
      repositories:
        enabled: false  

  cache:
    redis:
      time-to-live: 30m

  jpa:
    show-sql: false