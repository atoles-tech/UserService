management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,metrics
  endpoint:
    health:
      show-details: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    eureka-service-url-poll-interval-seconds: 3
    eureka-server-connect-timeout-seconds: 5
  instance:
    lease-expiration-duration-in-seconds: 30

server:
  port: 8081

spring:
  application:
     name: user-service
  profiles:
    active: local
  liquibase: 
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

