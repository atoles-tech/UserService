spring:
  application:
    name: user-service
  profiles:
    active: local 

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/user_service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      repositories:
        enabled: false  
  
  cache:
    redis:
      time-to-live: 30m

  liquibase: 
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/user_service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    
  data:
    redis:
      host: redis
      port: 6379
      timeout: 5000ms
      repositories:
        enabled: false  

  cache:
    redis:
      time-to-live: 30m

  liquibase: 
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always